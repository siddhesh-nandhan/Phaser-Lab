<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phaser Lab</title>
  <meta name="description" content="A browser workbench for game UI effects: screen transitions, button effects, canvas and Phaser animations, and Three.js shaders. Write code, tune settings, see it run.">
  <meta name="theme-color" content="#090909">
  <meta property="og:title" content="Phaser Lab">
  <meta property="og:description" content="Write game UI effects on the left, watch them run on the right.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ffffff' d='M2 8 16 0 30 8 30 24 16 32 2 24Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#code">Skip to the code editor</a>

  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path d="M2 8 16 0 30 8 30 24 16 32 2 24Z" fill="currentColor"/></svg>
      <span>Phaser Lab</span>
    </div>
    <nav class="tabs" aria-label="Tools">
      <div class="tabs-track" id="tabs"></div>
    </nav>
    <span class="privacy">Your work stays in this browser</span>
  </header>

  <main class="bench">
    <section class="dock" aria-label="Preset and settings">
      <div class="dock-bar">
        <label class="field">Preset
          <select id="preset"></select>
        </label>
        <div class="extras" id="extras"></div>
        <button class="toggle" id="settingsToggle" type="button" aria-expanded="true" aria-controls="settings">Settings</button>
      </div>
      <div class="dock-settings" id="settings"></div>
    </section>

    <section class="code-pane" aria-labelledby="codeTitle">
      <div class="pane-head">
        <h2 id="codeTitle">Code</h2>
        <span class="shortcut" id="shortcut"></span>
        <button id="restore" type="button">Restore preset</button>
      </div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-labelledby="codeTitle"></textarea>
      <details class="howto">
        <summary>How it works</summary>
        <p id="help"></p>
      </details>
    </section>

    <section class="workspace" aria-labelledby="title">
      <div class="toolbar">
        <div>
          <h1 id="title">Phaser Lab</h1>
          <p id="subtitle"></p>
        </div>
        <div class="actions">
          <button id="stop" type="button">Stop</button>
          <button id="run" class="primary" type="button">Run</button>
        </div>
      </div>
      <div class="stage" id="stage"></div>
      <div class="status">
        <span id="status" role="status">Loading…</span>
        <span id="info"></span>
      </div>
    </section>
  </main>
</body>
</html>
